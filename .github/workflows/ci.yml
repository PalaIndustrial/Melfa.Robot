name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - run: dotnet build .\Melfa.Robot\Melfa.Robot.csproj --configuration Release
      - run: dotnet test .\Melfa.Robot.PositionTests\Melfa.Robot.PositionTests.csproj --configuration Release
